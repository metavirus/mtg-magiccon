  :root {
    color-scheme: dark;
    --panel: #101d2e;
    --line: #2a3b53;
    --muted: #91a0b5;
    --blue: #79aaff;
    font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    color: #edf4fc;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body, #map-root { width: 100%; height: 100%; margin: 0; background: #101d2e; }
  button, input { font: inherit; }
  #map-root .private-floor-map { height: 100%; min-height: 0; max-height: none; border-radius: 0; overflow: visible; }
  /* Keep the form controls on a separate opaque paint layer from the interactive SVG. */
  #map-root .pf-toolbar, #map-root .pf-location {
    position: relative;
    z-index: 1;
    background: #101d2e;
    transform: translateZ(0);
  }
  .catalog-search {
    display: grid;
    align-items: center;
    min-width: 0;
    height: 36px;
    padding: 0 9px;
    border: 1px solid #36516f;
    border-radius: 9px;
    background: #101f32;
    color: #7794b8;
  }
  .catalog-search > span { font-size: 21px; line-height: 1; }
  .catalog-search input {
    min-width: 0;
    width: 100%;
    height: 100%;
    border: 0;
    outline: 0;
    background: transparent;
    color: #edf4fc;
    font-size: 12px;
  }
  .catalog-search input::placeholder { color: #a4b7cf; -webkit-text-fill-color: #a4b7cf; }
  @media (max-width: 620px) {
    #map-root .pf-toolbar .catalog-search input { font-size: 16px; }
  }
  .catalog-search input::-webkit-search-cancel-button { display: none; }
