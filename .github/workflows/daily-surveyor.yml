name: Daily MagicCon surveyor

on:
  workflow_dispatch:
    inputs:
      replay_run_id:
        description: "Retained run to review and restage; replay cannot accept a baseline"
        required: false
        type: string
      restore_from_artifact:
        description: "Verify recovery without the cache; uses validated accepted/runtime artifacts"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "15 17 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-magiccon-surveyor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --use-system-ca
      SURVEYOR_REPLAY_RUN_ID: ${{ inputs.replay_run_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install surveyor browser
        run: pnpm exec playwright install chromium
      - name: Restore monitoring baseline
        if: inputs.replay_run_id == '' && inputs.restore_from_artifact != true
        uses: actions/cache/restore@v6
        with:
          path: .monitoring-state
          key: monitoring-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: monitoring-state-
      - name: Restore pending work and delivery receipts
        if: inputs.restore_from_artifact != true
        uses: actions/cache/restore@v6
        with:
          path: .surveyor-runtime
          key: surveyor-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: surveyor-runtime-
      - name: Recover verified cloud state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/prepare_surveyor_state.mjs
      - name: Download retained survey artifact for replay
        if: inputs.replay_run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: daily-magiccon-surveyor
          path: work/monitoring
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.replay_run_id }}
      - name: Run surveyor to terminal outcome
        id: runtime
        env:
          SUPABASE_URL: https://pavjsexxbueuzhzgemgy.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ALERT_GMAIL_USERNAME: ${{ vars.ALERT_GMAIL_USERNAME }}
          ALERT_GMAIL_APP_PASSWORD: ${{ secrets.ALERT_GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
        run: node scripts/run_daily_surveyor.mjs
      - name: Verify complete coverage and consequences
        if: steps.runtime.outputs.ready_for_cache == 'true'
        run: pnpm monitor:verify-supervision work/monitoring/monitor-check.json work/monitoring/closure-manifest.json
      - name: Retain verified accepted baseline
        if: always() && hashFiles('work/monitoring/baseline-checkpoint.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: daily-magiccon-baseline
          path: work/monitoring/baseline-checkpoint.json
          retention-days: 90
          if-no-files-found: error
          overwrite: true
      - name: Save monitoring baseline
        if: success() && steps.runtime.outputs.ready_for_cache == 'true'
        uses: actions/cache/save@v6
        with:
          path: .monitoring-state
          key: monitoring-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain pending work and delivery receipts
        if: always() && hashFiles('.surveyor-runtime/*.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: daily-magiccon-runtime
          path: .surveyor-runtime/*.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
          overwrite: true
      - name: Save pending work and delivery receipts
        if: always() && hashFiles('.surveyor-runtime/*.json') != ''
        uses: actions/cache/save@v6
        with:
          path: .surveyor-runtime
          key: surveyor-runtime-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Summarize operational outcome
        if: always()
        shell: pwsh
        run: |
          if (Test-Path work/monitoring/run-receipt.json) {
            $receipt = Get-Content work/monitoring/run-receipt.json -Raw | ConvertFrom-Json
            Add-Content $env:GITHUB_STEP_SUMMARY "## MagicCon surveyor: $($receipt.operationalStatus)"
            Add-Content $env:GITHUB_STEP_SUMMARY "Baseline accepted: $($receipt.readyForCache)"
            if ($receipt.firstHeldAt) { Add-Content $env:GITHUB_STEP_SUMMARY "Agent-owned work held since $($receipt.firstHeldAt); original run $($receipt.originalRunId); overdue: $($receipt.overdue)" }
            if ($receipt.failedStage) { Add-Content $env:GITHUB_STEP_SUMMARY "Execution failed at $($receipt.failedStage). Inspect that step's logs." }
          } else {
            Add-Content $env:GITHUB_STEP_SUMMARY "## MagicCon surveyor: execution failed before receipt"
          }
      - name: Upload monitoring artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-magiccon-surveyor
          path: work/monitoring/
          retention-days: 90
          if-no-files-found: warn
          overwrite: true
