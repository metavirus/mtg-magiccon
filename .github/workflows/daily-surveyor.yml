name: Daily MagicCon surveyor

on:
  workflow_dispatch:
    inputs:
      replay_run_id:
        description: "Optional failed run ID whose retained survey artifact should be restaged"
        required: false
        type: string
  schedule:
    - cron: "15 17 * * *"

permissions:
  contents: read

concurrency:
  group: daily-magiccon-surveyor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --use-system-ca

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install surveyor browser
        run: pnpm exec playwright install chromium

      - name: Restore monitoring baseline
        if: inputs.replay_run_id == ''
        id: monitoring-state-restore
        uses: actions/cache/restore@v6
        with:
          path: .monitoring-state
          key: monitoring-state-${{ github.run_id }}
          restore-keys: |
            monitoring-state-

      - name: Run monitoring watch check
        if: inputs.replay_run_id == ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path work/monitoring | Out-Null
          node scripts/monitoring_watch_check.mjs | Tee-Object -FilePath work/monitoring/monitor-check.json

      - name: Download retained survey artifact for replay
        if: inputs.replay_run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: daily-magiccon-surveyor
          path: work/monitoring
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.replay_run_id }}

      - name: Stage deduplicated findings for Kavi review
        env:
          SUPABASE_URL: https://pavjsexxbueuzhzgemgy.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: pnpm monitor:stage work/monitoring/monitor-check.json

      - name: Summarize survey
        shell: pwsh
        run: |
          $report = Get-Content work/monitoring/monitor-check.json -Raw | ConvertFrom-Json
          Add-Content $env:GITHUB_STEP_SUMMARY "## Daily MagicCon surveyor"
          Add-Content $env:GITHUB_STEP_SUMMARY ""
          Add-Content $env:GITHUB_STEP_SUMMARY "- Checked at: $($report.checkedAt)"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Watched sources: $($report.sourceCount)"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Changed sources: $($report.changeCount)"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Fetch failures: $($report.failureCount)"
          Add-Content $env:GITHUB_STEP_SUMMARY "- First-party articles: $($report.newsletterIntake.observationCount) new/changed from $($report.newsletterIntake.fetchedCount) fetched ($($report.newsletterIntake.failureCount) isolated failures)"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Ticketed play signals: $($report.ticketedPlay.signalCount) ($($report.ticketedPlay.status))"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Mode: $($report.mode)"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Summary: $($report.summary)"
          if ($report.changeCount -gt 0) {
            Add-Content $env:GITHUB_STEP_SUMMARY ""
            Add-Content $env:GITHUB_STEP_SUMMARY "### Changed sources"
            foreach ($change in $report.changes) {
              Add-Content $env:GITHUB_STEP_SUMMARY "- $($change.label) (`$($change.id)`)"
            }
          }

      - name: Verify catch-to-closure contract
        run: pnpm monitor:verify-closure work/monitoring/monitor-check.json work/monitoring/closure-manifest.json

      - name: Save monitoring baseline
        if: success() && inputs.replay_run_id == ''
        uses: actions/cache/save@v6
        with:
          path: .monitoring-state
          key: monitoring-state-${{ github.run_id }}

      - name: Upload monitoring artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-magiccon-surveyor
          path: |
            work/monitoring/monitor-check.json
            work/monitoring/closure-manifest.json
          if-no-files-found: error
