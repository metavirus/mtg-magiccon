name: Deploy MagicCon companion to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    env:
      # Public browser config. This is intentionally not a service-role or secret key.
      # Keep CI self-contained so Pages never deploys the local-setup wall.
      VITE_SUPABASE_URL: https://pavjsexxbueuzhzgemgy.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_8LvSNisG4u-KITMzdheJaw_mgywJvJd
      NODE_OPTIONS: --use-system-ca

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ship checks
        run: pnpm check:ship

      - name: Build Pages artifact
        run: pnpm build:pages

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
