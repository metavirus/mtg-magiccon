name: Deploy MagicCon companion to GitHub Pages

on:
  push:
    branches:
      - main
      - codex/initial-foundation
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: windows-latest
    env:
      # Public browser config. This is intentionally not a service-role or secret key.
      # Keep CI self-contained so Pages never deploys the local-setup wall.
      VITE_SUPABASE_URL: https://pavjsexxbueuzhzgemgy.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_8LvSNisG4u-KITMzdheJaw_mgywJvJd

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ship checks
        run: pnpm check:ship

      - name: Build Pages artifact
        run: pnpm build:pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
