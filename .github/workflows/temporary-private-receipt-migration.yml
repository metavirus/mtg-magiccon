name: Temporary private receipt migration

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact main commit containing the reviewed temporary lane"
        required: true
        type: string
      confirmation:
        description: "Type MIGRATE_PRIVATE_RECEIPTS_cd84772"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: temporary-private-receipt-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --use-system-ca
      TARGET_SHA: ${{ inputs.target_sha }}
      CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - name: Enforce exact main run
        shell: bash
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${TARGET_SHA}" = "${GITHUB_SHA}"
          test "${CONFIRMATION}" = "MIGRATE_PRIVATE_RECEIPTS_cd84772"

      - name: Check out exact branch commit and history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Refuse completed migration
        env:
          SUPABASE_URL: https://pavjsexxbueuzhzgemgy.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/verify_private_receipt_migration.mjs --preflight

      - name: Recover historical proof into runner-only workspace
        run: node scripts/prepare_private_receipt_migration.mjs work/private-receipt-migration/manifest.json

      - name: Validate historical artifact plan
        run: pnpm artifacts:migrate-private -- work/private-receipt-migration/manifest.json

      - name: Upload historical artifacts and private receipt fields
        env:
          SUPABASE_URL: https://pavjsexxbueuzhzgemgy.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: pnpm artifacts:migrate-private -- work/private-receipt-migration/manifest.json --apply

      - name: Validate legacy database HTML plan
        env:
          SUPABASE_URL: https://pavjsexxbueuzhzgemgy.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: pnpm artifacts:migrate-legacy-html

      - name: Migrate and clear legacy database HTML
        env:
          SUPABASE_URL: https://pavjsexxbueuzhzgemgy.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: pnpm artifacts:migrate-legacy-html -- --apply

      - name: Verify every checksum and mark complete
        env:
          SUPABASE_URL: https://pavjsexxbueuzhzgemgy.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/verify_private_receipt_migration.mjs --complete

      - name: Remove runner-only private files
        if: always()
        shell: bash
        run: rm -rf -- "${GITHUB_WORKSPACE}/work/private-receipt-migration"
